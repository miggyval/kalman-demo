name: Checks
on: [push, pull_request]
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/browser-model.test.js
      - run: node tests/browser-ui.test.js
      - run: node tests/live-model.test.js
      - run: node tests/filters.test.js
      - run: node tests/augmented-model.test.js
